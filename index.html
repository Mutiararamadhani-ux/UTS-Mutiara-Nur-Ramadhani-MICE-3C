<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | Mova</title>
  <meta name="description" content="Sign in to your Mova account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#signin">Skip to sign in form</a>

  <main class="auth">

    <!-- Left: cute artwork made with HTML + CSS only -->
    <section class="stage" aria-label="Mova branding">
      <div class="art" aria-hidden="true">
        <div class="floor">
          <span class="bt bt--stage" style="--i:0"></span>
          <span class="bt" style="--i:1"></span>
          <span class="bt" style="--i:2"></span>
          <span class="bt" style="--i:3"></span>
          <span class="bt bt--gap" style="--i:4"></span>
          <span class="bt bt--hi d3" style="--i:5"></span>
          <span class="bt" style="--i:6"></span>
          <span class="bt" style="--i:7"></span>
          <span class="bt" style="--i:8"></span>
          <span class="bt bt--hi d1" style="--i:9"></span>
          <span class="bt" style="--i:10"></span>
          <span class="bt" style="--i:11"></span>
          <span class="bt bt--gap" style="--i:12"></span>
          <span class="bt" style="--i:13"></span>
          <span class="bt bt--acc d4" style="--i:14"></span>
          <span class="bt" style="--i:15"></span>
          <span class="bt" style="--i:16"></span>
          <span class="bt bt--gap" style="--i:17"></span>
          <span class="bt bt--gap" style="--i:18"></span>
          <span class="bt bt--gap" style="--i:19"></span>
          <span class="bt bt--gap" style="--i:20"></span>
          <span class="bt bt--gap" style="--i:21"></span>
          <span class="bt bt--gap" style="--i:22"></span>
          <span class="bt bt--gap" style="--i:23"></span>
          <span class="bt bt--gap" style="--i:24"></span>
          <span class="bt" style="--i:25"></span>
          <span class="bt" style="--i:26"></span>
          <span class="bt" style="--i:27"></span>
          <span class="bt bt--gap" style="--i:28"></span>
          <span class="bt" style="--i:29"></span>
          <span class="bt" style="--i:30"></span>
          <span class="bt" style="--i:31"></span>
          <span class="bt" style="--i:32"></span>
          <span class="bt" style="--i:33"></span>
          <span class="bt" style="--i:34"></span>
          <span class="bt" style="--i:35"></span>
          <span class="bt bt--gap" style="--i:36"></span>
          <span class="bt" style="--i:37"></span>
          <span class="bt bt--hi d4" style="--i:38"></span>
          <span class="bt" style="--i:39"></span>
          <span class="bt" style="--i:40"></span>
          <span class="bt" style="--i:41"></span>
          <span class="bt bt--hi d2" style="--i:42"></span>
          <span class="bt" style="--i:43"></span>
          <span class="bt bt--gap" style="--i:44"></span>
          <span class="bt" style="--i:45"></span>
          <span class="bt" style="--i:46"></span>
          <span class="bt" style="--i:47"></span>
          <span class="bt bt--hi d3" style="--i:48"></span>
          <span class="walker walker--v1"></span>
          <span class="walker walker--v2"></span>
          <span class="walker walker--h1"></span>
          <span class="walker walker--h2"></span>
        </div>
      </div>

      <div class="stage__text">
        <p class="stage__tagline"><span>Every Event,</span> <span>One Platform.</span></p>
        <p class="stage__sub">Meetings, incentives, conventions, and exhibitions in one account.</p>
      </div>
    </section>

    <!-- Right: sign in -->
    <section class="login" id="signin" aria-labelledby="login-title">
      <div class="login__box">

        <!-- Logo drawn with inline SVG + text -->
        <div class="brand" role="img" aria-label="Mova">
          <svg class="brand__mark" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" focusable="false">
            <defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0b1b3a"/></linearGradient></defs>
            <rect width="44" height="44" rx="11" fill="url(#mg)"/>
            <path d="M12 31V14l10 11 10-11v17" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="32" cy="12" r="3" fill="#2dd4bf"/>
          </svg>
          <span class="brand__name" aria-hidden="true">Mova</span>
        </div>

        <h1 class="login__title" id="login-title">Welcome back</h1>

        <button type="button" class="btn btn--google">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 0 0 0 24c0 3.88.92 7.55 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign in with Google
        </button>

        <div class="divider" role="separator"><span>or</span></div>

        <form id="signin-form" aria-labelledby="login-title" novalidate>
          <div class="field">
            <label for="identity">Email or username</label>
            <input type="text" id="identity" name="identity" placeholder="Enter email or username" autocomplete="username" required aria-describedby="identity-error">
            <p class="error" id="identity-error" role="alert" hidden>Enter your email or username.</p>
          </div>

          <div class="field">
            <div class="field__row">
              <label for="password">Password</label>
              <a class="link" href="#">Forgot Password?</a>
            </div>
            <div class="password">
              <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required aria-describedby="password-error">
              <button type="button" class="password__toggle" id="toggle-password" aria-label="Show password" aria-pressed="false">
                <svg class="eye eye--open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye eye--closed" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden>
                  <path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19M1 1l22 22"/>
                </svg>
              </button>
            </div>
            <p class="error" id="password-error" role="alert" hidden>Enter your password.</p>
          </div>

          <label class="remember">
            <input type="checkbox" name="remember">
            <span>Remember Me</span>
          </label>

          <button type="submit" class="btn btn--primary">Sign In</button>
          <p class="status" id="form-status" role="status" aria-live="polite"></p>
        </form>

        <p class="terms">By continuing, you agree to our <a class="link" href="#">Terms</a> and <a class="link" href="#">Privacy Policy</a>.</p>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
